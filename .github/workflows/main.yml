name: Build and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project (TanStack Start)
        run: bun run build

      - name: Generate SPA shell + .htaccess for Plesk
        run: bun run prerender

      - name: Verify build output
        run: |
          test -f dist/client/index.html || (echo "Missing dist/client/index.html" && exit 1)
          test -f dist/client/.htaccess || (echo "Missing dist/client/.htaccess" && exit 1)
          if grep -Eq '<body[^>]*>\s*</body>' dist/client/index.html; then
            echo "dist/client/index.html has an empty body"
            exit 1
          fi
          if ! grep -q 'Mikodawa Docs' dist/client/index.html; then
            echo "dist/client/index.html does not contain the Mikodawa Docs metadata"
            exit 1
          fi
          if ! grep -q 'Todo tu trabajo' dist/client/index.html; then
            echo "dist/client/index.html does not contain the prerendered home content"
            exit 1
          fi
          if ! grep -q 'product-grid' dist/client/index.html; then
            echo "dist/client/index.html does not contain the product grid"
            exit 1
          fi
          test -f dist/client/atlas/index.html || (echo "Missing prerendered Atlas route" && exit 1)
          if ! grep -q 'Mikodawa Atlas' dist/client/atlas/index.html; then
            echo "dist/client/atlas/index.html does not contain the Atlas documentation"
            exit 1
          fi
          ls -lah dist/client | head -20

      - name: Deploy via FTP (with retries)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            npx --yes lftp-cli >/dev/null 2>&1 || true
            sudo apt-get update -qq && sudo apt-get install -y lftp
            lftp -c "
              set ftp:ssl-allow no;
              set net:timeout 30;
              set net:max-retries 5;
              set net:reconnect-interval-base 10;
              set ftp:passive-mode on;
              set mirror:parallel-transfer-count 1;
              open -u adminmikodawasign,'7k0?gGh07' -p 21 mikodawa.com;
              mirror -R --no-perms --verbose --exclude-glob .git* --exclude-glob node_modules/ dist/client/ /;
            "
