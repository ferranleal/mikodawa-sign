name: Build and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Sign frontend (Vite)
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          test -f dist/sign-icon.svg
          grep -q 'Mikodawa Sign' dist/index.html
          grep -q 'id="root"' dist/index.html
          test -n "$(find dist/assets -maxdepth 1 -name '*.js' -print -quit)"
          test -n "$(find dist/assets -maxdepth 1 -name '*.css' -print -quit)"

      - name: Deploy via FTP (with retries)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 5
          retry_wait_seconds: 30
          command: |
            npx --yes lftp-cli >/dev/null 2>&1 || true
            sudo apt-get update -qq && sudo apt-get install -y lftp
            lftp -c "
              set ftp:ssl-allow no;
              set net:timeout 30;
              set net:max-retries 5;
              set net:reconnect-interval-base 10;
              set ftp:passive-mode on;
              set mirror:parallel-transfer-count 1;
              open -u adminmikodawasign,'7k0?gGh07' -p 21 mikodawa.com;
              mirror -R --no-perms --verbose --exclude-glob .git* --exclude-glob node_modules/ dist/ /;
            "
